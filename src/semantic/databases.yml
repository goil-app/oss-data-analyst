# Database Catalog
# Lists all available MongoDB databases and their collections
#
# Translated names: many "name"/"description"/"displayName" fields are NOT text but an ObjectId
# pointing to the Translation collection OF THE SAME DATABASE (each DB has its own copy).
# Join on Translation._id (never on tag) and read es/ca, falling back to "default" (always set):
#   {"$lookup": {"from": "Translation", "localField": "name", "foreignField": "_id", "as": "t"}},
#   {"$addFields": {"label": {"$ifNull": [{"$first": "$t.es"}, {"$first": "$t.default"}]}}}
# Examples: AccountDB AccountType.name, AccountRole.name, Channel.name; AlertDB AlertType.name/description.

databases:
  - name: ClientDB
    description: Business tenant configuration, subscription plans, and client management data
    collections:
      - Business
      - Plan

  - name: AnalyticsDB
    description: User activity, notifications, alerts, engagement tracking, and configuration data
    collections:
      - UserActivity
      - AlertActions
      - TrackNotifications
      - NotificationRead
      - Branding
      - SmartNotificationFeedback
      - WhatsAppMessageTracking
      - Translation
      - ChartType

  - name: AccountDB
    description: User accounts, roles, sessions, and communication channel subscriptions
    collections:
      - Account
      - AccountType
      - AccountRole
      - AccountSessionInfo
      - Channel
      - ChannelAccount
      - Translation

  - name: AlertDB
    description: Emergency alerts, alert types, state transition records, and GPS location trails
    collections:
      - Alert
      - AlertType
      - AlertRecord
      - AlertLocation
      - Translation
      - Workflow

  - name: NotificationDB
    description: Push notification records and per-user read/archive status
    collections:
      - Notification
      - NotificationAccountArchive

  - name: EventDB
    description: Bookable events and appointments with attendee tracking
    collections:
      - EventV2

  - name: DocumentDB
    description: Digital wallets, vouchers, and wallet transaction history
    collections:
      - Wallet
      - WalletHistory
      - WalletType

  - name: ProjectsDB
    description: AI-generated projects (websites, stores, app modules) built per business with the AI project builder, their chat turns and templates
    collections:
      - Projects
      - ProjectConversations
      - ProjectChats
      - Templates

  - name: IntegrationDB
    description: AI usage ledger (tokens and cost per AI call, per business/project) and the AI model catalog with prices
    collections:
      - AIUsageEvents
      - AIModels
