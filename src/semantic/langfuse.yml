# Langfuse: LLM observability of the Goil backend (query with ExecuteLangfuse)
# One Langfuse project holds every backend AI feature. Costs are computed by Langfuse from its model price table
# Models it doesn't know show 0 cost (help-center.chat is always 0 here). Langfuse and IntegrationDB.AIUsageEvents.costUsd use
# different price tables and differ (~20% on project-builder-chat; titles are 0 in AIUsageEvents): say which source a cost comes from.
# Production traces have environment "community" (scores: "default").

traces:  # trace name = observation name of the generation (use as "traceName" dimension or "name" filter)
  project-builder-chat:
    what: AI project builder turn (websites, modules). tags [<project kind>, project_generation]
    userId: businessId (ClientDB.Business._id)
    sessionId: projectId (ProjectsDB.Projects._id)
  store-builder-chat:
    what: AI online store builder turn
  projects-version-title / projects-conversation-title / projects-project-title:
    what: Cheap title generation (haiku). userId = businessId, sessionId = projectId
  projects-enhance-prompt:
    what: Prompt enhancer of the builder. No userId/sessionId (backend bug), metadata.businessId / metadata.projectId instead
  project-image-generation:
    what: Image generated by the builder (gpt-image-1). Own trace, no ids, no usage
  help-center.chat:
    what: Help center AI assistant answer. tags [help-center]
    userId: accountId (AccountDB.Account._id, the backoffice admin)
    sessionId: help center conversation id (PostHog help_session_id is different)
    metadata: businessId, locale, route
  smart-notification:
    what: AI-written push notification variants (one trace per batch). No userId/sessionId/businessId.
    join: AnalyticsDB.SmartNotificationFeedback.traceId (has businessId, prompt, feedback) -> Langfuse trace id
  smart-translation:
    what: AI translation of backoffice texts, one generation per target language. No ids. Count/cost/latency only
  anima-route-enrich:
    what: Route enrichment agent

scores:  # scores-numeric view (BOOLEAN scores are there too), or endpoint "scores"
  user-feedback: Project builder thumbs up/down, NUMERIC 1 | -1, optional comment
  help-center-resolution: Help center "did this solve it?", BOOLEAN 1 | 0
  smart-notification-feedback: Rating of a smart notification, BOOLEAN (also smart-notification-feedback-variant-<n>)

metrics_api:  # endpoint "metrics", params = query object
  views: observations | scores-numeric | scores-categorical
  observations_dimensions: environment, type (GENERATION|SPAN|EVENT), name, level (ERROR = failed call), tags, release, traceName, providedModelName, promptName, promptVersion, startTimeMonth
  observations_measures: count, latency (ms), timeToFirstToken, inputTokens, outputTokens, totalTokens, inputCost, outputCost, totalCost (USD), countScores
  scores_dimensions: name, source, dataType, value, traceName, observationName, observationModelName, timestampDay, timestampMonth
  aggregations: sum, avg, count, max, min, p50, p75, p90, p95, p99
  time: timeDimension {granularity: day|week|month|auto}; fromTimestamp and toTimestamp ISO strings are REQUIRED
  result_columns: "<aggregation>_<measure>" (e.g. sum_totalCost), use them in orderBy
  cannot_group_by: userId, sessionId, traceId, id (filter only). So per business/project breakdowns: filter one id at a time, or use MongoDB AIUsageEvents
  filters: '{"column": "traceName", "operator": "=", "value": "smart-notification", "type": "string"}'
  filter_types: string (= contains ...), stringOptions (any of / none of), arrayOptions for tags, stringObject with "key" for metadata, number, datetime
  cost_tip: sum totalCost only over type GENERATION ({"column":"type","operator":"=","value":"GENERATION","type":"string"})

examples:
  - desc: Cost, calls and tokens per feature last 30 days
    params: '{"view":"observations","dimensions":[{"field":"traceName"}],"metrics":[{"measure":"totalCost","aggregation":"sum"},{"measure":"count","aggregation":"count"},{"measure":"totalTokens","aggregation":"sum"}],"filters":[{"column":"type","operator":"=","value":"GENERATION","type":"string"}],"fromTimestamp":"2026-08-25T00:00:00Z","toTimestamp":"2026-09-24T00:00:00Z","orderBy":[{"field":"sum_totalCost","direction":"desc"}]}'
  - desc: Smart notification generations per day and p95 latency
    params: '{"view":"observations","metrics":[{"measure":"count","aggregation":"count"},{"measure":"latency","aggregation":"p95"}],"filters":[{"column":"traceName","operator":"=","value":"smart-notification","type":"string"},{"column":"type","operator":"=","value":"GENERATION","type":"string"}],"timeDimension":{"granularity":"day"},"fromTimestamp":"2026-09-01T00:00:00Z","toTimestamp":"2026-09-24T00:00:00Z"}'
  - desc: Cost by model for one business (userId filter)
    params: '{"view":"observations","dimensions":[{"field":"providedModelName"}],"metrics":[{"measure":"totalCost","aggregation":"sum"}],"filters":[{"column":"userId","operator":"=","value":"<businessId>","type":"string"}],"fromTimestamp":"2026-09-01T00:00:00Z","toTimestamp":"2026-09-24T00:00:00Z"}'
  - desc: Average help center resolution
    params: '{"view":"scores-numeric","dimensions":[{"field":"name"}],"metrics":[{"measure":"value","aggregation":"avg"},{"measure":"count","aggregation":"count"}],"fromTimestamp":"2026-09-01T00:00:00Z","toTimestamp":"2026-09-24T00:00:00Z"}'
  - desc: Latest traces of a project (endpoint traces)
    params: '{"sessionId":"<projectId>","orderBy":"timestamp.desc","limit":20}'

cross_source:
  - AI cost per client: MongoDB IntegrationDB.AIUsageEvents grouped by businessId (projects + help center), plus Langfuse for features not in the ledger
  - Business names: ClientDB.Business by _id; project names: ProjectsDB.Projects by _id
  - From a Mongo row with traceId (AIUsageEvents, SmartNotificationFeedback): traces endpoint cannot filter by id list; use metrics with {"column":"traceId","operator":"any of","value":[...],"type":"stringOptions"}
