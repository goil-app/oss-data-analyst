name: Projects
type: dimension_table
database: ProjectsDB
table: ProjectsDB.Projects
grain: one row per AI-generated project
description: Project generated by the AI project builder for a business (website, online store or app module). Holds the accumulated AI cost and tokens.
common_questions:
  - How many projects per business / kind / status?
  - Which projects cost the most in AI?

dimensions:
  - {name: _id, sql: _id, type: string, description: "Project id. Same value as AIUsageEvents.projectId and as Langfuse sessionId of project traces"}
  - {name: businessId, sql: businessId, type: string, description: "ObjectId -> ClientDB.Business._id. Also the Langfuse userId of project traces"}
  - {name: creatorAccountId, sql: creatorAccountId, type: string, description: "ObjectId -> AccountDB.Account._id"}
  - {name: templateId, sql: templateId, type: string, description: "ObjectId -> Templates._id"}
  - {name: name, sql: name, type: string, description: Project name (plain text)}
  - {name: kind, sql: kind, type: string, description: "website | store | module"}
  - {name: status, sql: status, type: string, description: "draft | processing | ready | deployed | published | failed"}
  - {name: currentVersion, sql: currentVersion, type: number, description: Latest generated version number (roughly number of AI iterations)}
  - {name: deployedVersion, sql: deployedVersion, type: number, description: Version deployed (0 = never deployed)}
  - {name: deployedUrl, sql: deployedUrl, type: string, description: Public URL when deployed}
  - {name: deleted, sql: deleted, type: boolean, description: Soft delete flag. Exclude deleted:true unless asked}

time_dimensions:
  - {name: createdAt, sql: createdAt, type: time, description: Creation date}
  - {name: updatedAt, sql: updatedAt, type: time, description: Last change}

measures:
  - {name: totalCost, sql: totalCost, type: sum, description: Accumulated AI cost of the project in USD}
  - {name: totalTokens, sql: totalTokens, type: sum, description: Accumulated AI tokens of the project}
