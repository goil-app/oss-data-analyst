name: AccountType
type: dimension_table
database: AccountDB
table: AccountDB.AccountType
grain: one row per account type
description: Definitions of user/role types on the platform (e.g. citizen, admin, operator) with ordering index and soft-delete
common_questions:
  - What account types exist?
  - How many accounts per account type?
  - Which account types are active (not deleted)?

dimensions:
  - name: _id
    sql: _id
    type: string
    description: Unique account type identifier (ObjectId)

  - name: name
    sql: name
    type: string
    description: >
      NOT the display name: an ObjectId ref to AccountDB.Translation._id. The readable name is
      Translation.es / .ca, falling back to .default (see databases.yml header for the $lookup)

  - name: index
    sql: index
    type: number
    description: Ordering index for display purposes

  - name: businessId
    sql: businessId
    type: string
    description: Associated business identifier (ObjectId)

  - name: deleted
    sql: deleted
    type: boolean
    description: 'Soft-delete flag. Missing means active, so filter active ones with {"deleted": {"$ne": true}}'

measures:
  - name: count
    sql: _id
    type: count_distinct
    description: Total number of account types

  - name: active_count
    sql: _id
    type: count_distinct
    description: Number of non-deleted account types
    filters:
      - sql: "deleted = false OR deleted does not exist"

joins:
  - name: Translation
    database: AccountDB
    collection: Translation
    type: many_to_one
    local_field: name
    foreign_field: _id
